# APBS Rust runtime configuration
# APBS Rust 运行时配置
#
# Format: KEY=VALUE. Lines beginning with # are comments. Empty values unset optional variables.
# 格式：KEY=VALUE。以 # 开头的是注释。空值表示不设置该可选变量。
#
# Shell environment variables override this file.
# 命令行环境变量优先级高于本配置文件。

# Enable Rust debug logging when set to 1/true/yes/on.
# 是否启用 Rust 调试日志；设为 1/true/yes/on 时启用。
APBS_RUST_DEBUG=0

# Fallback Rayon thread count used when RAYON_NUM_THREADS is not set by the shell.
# 当命令行未设置 RAYON_NUM_THREADS 时使用的 Rayon 线程数回退值。
APBS_RUST_RAYON_THREADS=12

# Rayon worker threads used by intra-block parallel kernels.
# block 内部并行计算使用的 Rayon 工作线程数。
RAYON_NUM_THREADS=12
APBS_RUST_PARALLEL_BLOCKS=1


APBS_RUST_BLOCK_THREADS=4

# Default cap for native Newton nonlinear solver iterations.
# Rust 原生 Newton 非线性求解器默认最大迭代次数。
APBS_RUST_NEWTON_ITMAX=20

# Native nonlinear solver: newton is stable; mgfas is experimental.
# Rust 原生非线性求解器：newton 稳定；mgfas 为实验路径。
APBS_RUST_NONLIN_SOLVER=newton

# PMGC coarse operator/preconditioner mode. Default op7 matches current validated path.
# PMGC 粗网格算子/预条件模式。默认 op7 为当前验证路径。
APBS_RUST_PC_MODE=op7
APBS_RUST_FORCE_MGSOLV=mgfas

# Coarse-grid restriction mode. inject is the C-compatible validated default.
# 粗网格限制模式。inject 是已验证的 C 兼容默认值。
APBS_RUST_RESTRICT_MODE=inject
APBS_RUST_FORCE_MGCOAR=inject

# Apply post-Dirichlet boundary correction when set to 1.
# 是否应用后处理 Dirichlet 边界修正；设为 1 时启用。
APBS_RUST_APPLY_POST_DIRICHLET=1

# Clamp cap used by SMPBE mobile-ion energy calculations.
# SMPBE 移动离子能量计算使用的势能截断上限。
APBS_RUST_QM_UCAP=5.0

# Force alpha1 coefficient path when set to 1. Intended for diagnostics.
# 是否强制 alpha1 系数路径；设为 1 时启用，主要用于诊断。
APBS_RUST_FORCE_ALPHA1=0
